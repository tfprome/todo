services:
  backend-todo-app:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "5013:3000"

    environment:
      PORT: 3000
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}

    networks:
      - devops-training

networks:
  devops-training:
    external: true