services:
  frontend-todo-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5014:5000"
    environment:
      - VITE_API_URL=${VITE_API_URL}
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - devops-training

networks:
  devops-training:
    external: true